server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Attachments (15 MB each, up to 10 per request) and spreadsheet imports.
  client_max_body_size 160m;

  # The API container gets a new address each time it is recreated (an update, a changed
  # setting). Its name is looked up again through Docker's DNS instead of once at start-up:
  # with the name written straight into proxy_pass, nginx would keep sending requests to the
  # old address until it is restarted too.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  # Live updates: a long-lived stream that must reach the browser unbuffered.
  location /api/events {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # AI analysis and large exports can take a while.
    proxy_read_timeout 180s;
  }

  # File names carry a content hash, so they can be cached for a long time.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path loads index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
