server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # No version of nginx in the Server header or on its error pages.
  server_tokens off;

  # Content-Security-Policy and the other security headers, on every answer. The locations below
  # with an add_header of their own include the file again: nginx would leave them without these.
  include /etc/nginx/snippets/security-headers.conf;
  # What goes out from the API: nginx's nosniff instead of a second copy of the API's, and not the
  # X-Powered-By of Express, which names the software as server_tokens would.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Powered-By;

  # The largest request the API takes: an upload of attachments, 10 files of 15 MB
  # (api/src/tickets/attachments.controller.ts), plus the headers of the form around them, a few KB.
  # An import (20 MB), the images for the AI (4 of 8 MB) and a logo (8 MB) are smaller. nginx keeps
  # a large body in a temporary file, not in memory, and passes it on once it has it whole.
  client_max_body_size 151m;
  # Over that size the answer has the shape of the API's errors, whose message the web shows,
  # instead of nginx's page.
  error_page 413 @too_large;
  location @too_large {
    default_type "application/json; charset=utf-8";
    return 413 '{"statusCode":413,"error":"Payload Too Large","message":"Lo enviado pesa más de 151 MB, lo máximo que el servidor recibe de una vez. Cada adjunto puede pesar hasta 15 MB."}';
  }

  # The API container gets a new address each time it is recreated (an update, a changed
  # setting). Its name is looked up again through Docker's DNS instead of once at start-up:
  # with the name written straight into proxy_pass, nginx would keep sending requests to the
  # old address until it is restarted too.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  # Live updates: a long-lived stream that must reach the browser unbuffered.
  location /api/events {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The address of the client, as in /api/ below: the API limits the requests of each one.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # AI analysis and large exports can take a while.
    proxy_read_timeout 180s;
  }

  # File names carry a content hash, so they can be cached for a long time.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Single-page app: every other path loads index.html.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
