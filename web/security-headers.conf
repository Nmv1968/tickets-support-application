# Security headers of every answer of the web and of the API. nginx.conf includes this file in its
# server block and again in each location with an add_header of its own: a block that sets any
# add_header gets none from the block around it. "always": also on errors (401, 404, 413...).
#
# Content-Security-Policy: what the built app needs, and nothing else.
# - script-src 'self': only the bundles of the build. No inline script and no inline handler
#   (onload="..."): that is why angular.json keeps "inlineCritical" off, as the critical CSS it
#   inlines loads the rest of the styles with an onload handler.
# - style-src 'unsafe-inline': Angular writes the styles of each component in <style> elements
#   while the app runs, and the CDK, ng-select and Chart.js set style attributes.
# - img-src blob: data:: the thumbnails of the attachments, the images of the AI dialog and a logo
#   before it is uploaded are shown from object URLs (blob:).
# - connect-src 'self': the API and its live stream (/api/events), on this same address.
# - frame-ancestors 'none' and X-Frame-Options: no other page shows the app inside a frame.
# e2e/tests/security-headers.spec.ts checks these values and goes through every screen looking for
# a violation: a change here or in the app that needs more changes both.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# No device or browser feature for the app or anything inside it, except the clipboard: the reply
# for the customer is copied to it ("Copiar"), and the AI dialog reads a screenshot from it ("Pegar
# captura"). A photo taken from the AI dialog comes through a file input, not through the camera.
add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), clipboard-read=(self), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
# No Strict-Transport-Security: the app is served over plain HTTP on the local network (see the
# README, "Acceso desde otras máquinas"). An HTTPS proxy in front of it may add one.
