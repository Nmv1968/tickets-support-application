name: support-tickets

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: support
      # Platform-independent UTF-8 locale built into PostgreSQL 17+.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://support:${POSTGRES_PASSWORD}@db:5432/support?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # How long a session lasts. Empty: the default of the API (see .env.example).
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      APP_SECRET: ${APP_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      MCP_USERNAME: ${MCP_USERNAME:-claude}
      MCP_NAME: ${MCP_NAME:-Claude}
      MCP_PASSWORD: ${MCP_PASSWORD:-}
      # Limits per client address. Empty: the default of the API (see .env.example).
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      UPLOAD_DIR: /data/uploads
      PORT: 3000
      TZ: ${TZ:-America/Guayaquil}
    # Memory of the API, and no swap beyond it. The heaviest work is an import of 20,000 rows:
    # ExcelJS holds the whole sheet in memory. Measured on the end-to-end stack, from about 80 MB
    # at rest: the heaviest sheet the API accepts (just under 50 MB uncompressed of small cells,
    # see api/src/transfer/xlsx-size.ts) peaked at 930 MB; 20,000 cases with descriptions and
    # observations of 1,000 characters each, imported, at 810 MB; 150 MB of attachments, at 250 MB.
    # Node gives its heap half of this memory: with 1 GB, 524 MB, short of the 640 MB that sheet
    # needs.
    mem_limit: 1536m
    memswap_limit: 1536m
    volumes:
      - uploads:/data/uploads
    # Healthy while GET /api/health answers: the API is up and reaches its database. It starts by
    # applying the pending migrations, which an update can make take a while: the failures of the
    # first two minutes do not count.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 120s

  web:
    build: ./web
    restart: unless-stopped
    # Started once the API answers, so the first page does not meet a 502.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4300}:80"

  # Copies of the database and the attachments in a folder of this machine, outside Docker's
  # volumes: one when it starts, then every few hours (see backup/backup.sh and the README).
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: support
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: support
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - uploads:/data/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  pgdata:
  uploads:
