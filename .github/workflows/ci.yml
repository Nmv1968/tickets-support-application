# Checks every push and pull request to main: the unit tests of each part, the type checks, the
# build of the web, and the end-to-end tests against the application built with Docker Compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request makes the run still going for the previous one useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    # An empty database where Prisma replays the migrations to compare them with the schema,
    # created like the one of docker-compose.yml. It only lives during this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_DB: shadow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d shadow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Also generates the Prisma client: the "postinstall" script of package.json.
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      # ESLint with typescript-eslint (eslint.config.mjs), without --fix.
      - run: npm run lint
      - run: npm test
      # A change to prisma/schema.prisma without its migration, or a migration the schema does not
      # say, fails here (exit code 2) and prints what differs.
      - name: Schema matches the migrations
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://support@localhost:5432/shadow
          --exit-code

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p tsconfig.spec.json
      # ESLint with angular-eslint (eslint.config.mjs), without --fix.
      - run: npm run lint
      # Liberation Sans has the metrics of Arial, the font the specs draw with (src/test.ts), so
      # the specs that measure a layout get the same numbers as on Windows.
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation
      # Karma with the Google Chrome of the runner, without a window.
      - run: npm run test:ci
      - run: npx ng build

  mcp:
    name: Servidor MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      # The whole repository: the contract test reads the routes and fields of api/src.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx playwright install --with-deps chromium
      # Builds db, api and web from this checkout under the Docker Compose project "support-e2e",
      # with random secrets, and waits until GET /api/health says the API and its database answer.
      - run: npm run stack:up
      - run: npx playwright test
      - name: Logs of the stack
        if: failure()
        run: npm run stack:logs
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - name: Remove the stack
        if: always()
        run: npm run stack:down
